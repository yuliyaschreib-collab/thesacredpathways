# Deployment intentionally paused: the contents of this fork do NOT match the complete live website.
# Confirm the authoritative source and Azure resource before allowing any new deployment.
# Manual deployment requires an explicit approval toggle; normal commits do not publish.
name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
    inputs:
      confirm_full_source_reconciled:
        description: "Confirm that this repository has been reconciled with the complete live thesacredpathways.net source before replacing the website."
        required: true
        type: boolean
        default: false

jobs:
  build_and_deploy_job:
    if: ${{ inputs.confirm_full_source_reconciled == true }}
    runs-on: ubuntu-latest
    name: Manual approved Azure deployment
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_RIVER_07EBBF21E }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
